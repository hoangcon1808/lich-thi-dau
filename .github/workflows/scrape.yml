name: Auto Scraper

on:
  schedule:
    # Tự động chạy mỗi 20 phút
    - cron: '*/1 * * * *'
  # Cho phép bấm nút "Run workflow" thủ công trên GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape_and_update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chạy Script lấy dữ liệu
        run: python scraper.py

      - name: Commit và Push lên GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          # Lệnh || exit 0 giúp tránh báo lỗi nếu data.json không có gì mới
          git commit -m "Auto-update fixture data [skip ci]" || exit 0
          git push
