<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Fixtures Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --container-bg: #111827;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --neon-blue: #38bdf8;
            --neon-green: #34d399;
            --neon-red: #f87171;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            width: 100%;
            max-width: 800px;
            background: var(--container-bg);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), 0 0 2px var(--neon-blue);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        header {
            background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid var(--neon-blue);
        }

        h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .status-text {
            margin-top: 10px;
            font-size: 14px;
            color: var(--neon-blue);
            font-family: monospace;
        }

        .match-list {
            padding: 0;
            margin: 0;
        }

        .match-row {
            display: grid;
            grid-template-columns: 80px 1fr 80px 1fr 100px;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        .match-row:hover {
            background: #1e293b;
        }

        .match-row:last-child {
            border-bottom: none;
        }

        .time { color: var(--text-muted); font-size: 15px; font-weight: bold; }
        .team { font-size: 16px; font-weight: 600; }
        .team.home { text-align: right; padding-right: 15px; }
        .team.away { text-align: left; padding-left: 15px; }
        
        .score {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: var(--neon-blue);
            background: rgba(56, 189, 248, 0.1);
            padding: 5px 10px;
            border-radius: 6px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        .match-status {
            text-align: right;
            font-size: 13px;
            color: var(--neon-red);
            font-weight: bold;
        }

        /* Responsive cho Mobile */
        @media (max-width: 600px) {
            .match-row {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 10px;
                padding: 15px;
            }
            .team.home, .team.away { text-align: center; padding: 0; }
            .match-status { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <header>
            <h1>Lịch Thi Đấu Bóng Đá</h1>
            <div class="status-text" id="updateTime">Đang tải dữ liệu...</div>
        </header>

        <div class="match-list" id="matchesList">
            </div>
    </div>

    <script>
        const dataUrl = 'data.json?t=' + new Date().getTime();

        fetch(dataUrl)
            .then(response => response.json())
            .then(data => {
                document.getElementById('updateTime').innerHTML = `&#10227; Bot cập nhật lần cuối: ${data.last_updated}`;
                
                const container = document.getElementById('matchesList');
                container.innerHTML = ''; 
                
                if(data.matches && data.matches.length > 0) {
                    data.matches.forEach(match => {
                        container.innerHTML += `
                            <div class="match-row">
                                <div class="time">${match.time}</div>
                                <div class="team home">${match.home}</div>
                                <div class="score">${match.score}</div>
                                <div class="team away">${match.away}</div>
                                <div class="match-status">${match.status}</div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<div style="padding: 30px; text-align: center; color: #94a3b8;">Hôm nay không còn trận đấu nào sắp diễn ra.</div>';
                }
            })
            .catch(error => {
                document.getElementById('updateTime').innerHTML = '<span style="color: #f87171;">&#9888; Lỗi tải dữ liệu. Hãy đảm bảo bot đã chạy ít nhất 1 lần.</span>';
                console.error("Fetch Error:", error);
            });
    </script>
</body>
</html>
