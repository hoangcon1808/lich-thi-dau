<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Thi Đấu Bóng Đá</title>
    <style>
        :root {
            /* Bảng màu Trắng + Xanh lá */
            --bg-color: #f3f6f4;
            --container-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --primary-green: #10b981;
            --dark-green: #059669;
            --light-green: #d1fae5;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            width: 100%;
            max-width: 800px;
            background: var(--container-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        header {
            background: linear-gradient(135deg, var(--dark-green) 0%, var(--primary-green) 100%);
            padding: 25px 20px;
            text-align: center;
            color: white;
            /* Đảm bảo header luôn nằm trên cùng khi cuộn */
            position: relative;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            margin: 0;
            font-size: 26px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .status-text {
            margin-top: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
        }

        /* KHUNG CHỨA KẾT QUẢ CÓ THANH CUỘN */
        .match-list-wrapper {
            max-height: 500px; /* Chiều cao tối đa của danh sách. Bạn có thể tăng/giảm tuỳ ý */
            overflow-y: auto;  /* Tự động hiện thanh cuộn dọc nếu nội dung dài hơn 500px */
            background: var(--container-bg);
        }

        /* Tùy chỉnh (Custom) thanh cuộn cho mượt và đẹp */
        .match-list-wrapper::-webkit-scrollbar {
            width: 8px; /* Độ rộng của thanh cuộn */
        }

        .match-list-wrapper::-webkit-scrollbar-track {
            background: #f1f5f9; /* Màu nền của rãnh cuộn */
        }

        .match-list-wrapper::-webkit-scrollbar-thumb {
            background: #cbd5e1; /* Màu của thanh trượt */
            border-radius: 10px; /* Bo tròn thanh trượt */
        }

        .match-list-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--primary-green); /* Đổi sang màu xanh khi di chuột vào thanh trượt */
        }

        .match-list {
            padding: 0;
            margin: 0;
        }

        .match-row {
            display: grid;
            grid-template-columns: 80px 1fr 70px 1fr 100px;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .match-row:hover {
            background-color: var(--light-green);
            transform: translateX(4px);
        }

        .match-row:last-child {
            border-bottom: none;
        }

        .time { color: var(--text-muted); font-size: 15px; font-weight: 600; }
        .team { font-size: 16px; font-weight: 700; color: var(--text-main); }
        .team.home { text-align: right; padding-right: 15px; }
        .team.away { text-align: left; padding-left: 15px; }
        
        .score {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background: var(--primary-green);
            padding: 6px 0;
            border-radius: 20px;
            letter-spacing: 1px;
            box-shadow: 0 2px 4px rgba(16, 185, 129, 0.3);
        }

        .match-status {
            text-align: right;
            font-size: 13px;
            color: var(--primary-green);
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Responsive cho Mobile */
        @media (max-width: 600px) {
            .match-list-wrapper {
                max-height: 450px; /* Hạ thấp chiều cao một chút trên điện thoại */
            }
            .match-row {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 8px;
                padding: 15px;
            }
            .team.home, .team.away { text-align: center; padding: 0; font-size: 18px; }
            .score { width: 60px; margin: 5px auto; }
            .match-status { text-align: center; font-size: 12px; color: var(--text-muted); }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <header>
            <h1>Lịch Thi Đấu ⚽</h1>
            <div class="status-text" id="updateTime">Đang tải dữ liệu...</div>
        </header>

        <div class="match-list-wrapper">
            <div class="match-list" id="matchesList">
                </div>
        </div>
    </div>

    <script>
        const dataUrl = 'data.json?t=' + new Date().getTime();

        fetch(dataUrl)
            .then(response => response.json())
            .then(data => {
                document.getElementById('updateTime').innerHTML = `&#10227; Cập nhật lần cuối: ${data.last_updated}`;
                
                const container = document.getElementById('matchesList');
                container.innerHTML = ''; 
                
                if(data.matches && data.matches.length > 0) {
                    data.matches.forEach(match => {
                        container.innerHTML += `
                            <div class="match-row">
                                <div class="time">${match.time}</div>
                                <div class="team home">${match.home}</div>
                                <div class="score">${match.score}</div>
                                <div class="team away">${match.away}</div>
                                <div class="match-status">${match.status}</div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<div style="padding: 40px; text-align: center; color: #718096; font-size: 16px;">⚽ Hôm nay không còn trận đấu nào sắp diễn ra.</div>';
                }
            })
            .catch(error => {
                document.getElementById('updateTime').innerHTML = 'Lỗi tải dữ liệu. Hãy đảm bảo bot đã chạy!';
                console.error("Fetch Error:", error);
            });
    </script>
</body>
</html>
