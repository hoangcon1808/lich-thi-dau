<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lịch Thi Đấu Bóng Đá</title>
    <style>
        :root {
            --bg-color: #f3f6f4;
            --container-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --primary-green: #10b981;
            --dark-green: #059669;
            --light-green: #d1fae5;
            --league-bg: #f8fafc;
        }

        /* RESET & AUTO HEIGHT */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2vh 15px; /* Tự động thụt lề theo % chiều cao màn hình */
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* KHUNG DASHBOARD AUTO CO GIÃN */
        .dashboard {
            width: 100%;
            max-width: 800px;
            background: var(--container-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--border-color);
            /* BÍ QUYẾT CO GIÃN: Dashboard cao tối đa bằng 96% màn hình PC */
            max-height: 96vh; 
            display: flex;
            flex-direction: column; /* Sắp xếp Header và Khung cuộn theo chiều dọc */
        }

        /* HEADER CỐ ĐỊNH */
        header {
            background: linear-gradient(135deg, var(--dark-green) 0%, var(--primary-green) 100%);
            padding: 20px;
            text-align: center;
            color: white;
            position: relative;
            z-index: 20;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex-shrink: 0; /* Header không bao giờ bị bóp nhỏ */
        }

        h1 { margin: 0; font-size: 24px; font-weight: 800; text-transform: uppercase; }
        .status-text { margin-top: 5px; font-size: 12px; color: rgba(255, 255, 255, 0.85); }

        /* KHUNG CUỘN KẾT QUẢ TỰ LẤY PHẦN TRỐNG CÒN LẠI */
        .match-list-wrapper {
            flex-grow: 1; /* Tự động kéo giãn lấp đầy phần chiều cao còn lại của Dashboard */
            overflow-y: auto;
            background: var(--container-bg);
            position: relative;
        }

        .match-list-wrapper::-webkit-scrollbar { width: 6px; }
        .match-list-wrapper::-webkit-scrollbar-track { background: #f1f5f9; }
        .match-list-wrapper::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .match-list-wrapper::-webkit-scrollbar-thumb:hover { background: var(--primary-green); }

        .match-list { margin: 0; padding: 0; }

        /* THANH TIÊU ĐỀ GIẢI ĐẤU */
        .league-header {
            background-color: var(--league-bg);
            color: var(--dark-green);
            padding: 10px 15px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
        }
        .league-header::before { content: "🏆"; margin-right: 8px; font-size: 15px; }

        /* LƯỚI TRẬN ĐẤU - GIAO DIỆN PC */
        .match-row {
            display: grid;
            grid-template-columns: 80px 1fr 70px 1fr 100px;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }
        .match-row:hover { background-color: var(--light-green); }
        .match-row:last-child { border-bottom: none; }

        .time { color: var(--text-muted); font-size: 14px; font-weight: 600; }
        .team { font-size: 15px; font-weight: 700; color: var(--text-main); }
        .team.home { text-align: right; padding-right: 15px; }
        .team.away { text-align: left; padding-left: 15px; }
        
        .score {
            text-align: center; font-size: 13px; font-weight: bold; color: white;
            background: var(--primary-green); padding: 5px 0; border-radius: 20px;
        }

        .match-status { text-align: right; font-size: 12px; color: var(--primary-green); font-weight: 600; }

        /* ==================================================== */
        /* RESPONSIVE: TỰ ĐỘNG NHẬN DIỆN MÀN HÌNH ĐIỆN THOẠI      */
        /* ==================================================== */
        @media (max-width: 600px) {
            /* Biến website thành một App thực thụ (Full màn hình, không viền) */
            body { padding: 0; align-items: stretch; }
            .dashboard { 
                max-width: 100%; 
                height: 100vh; /* Cao đúng 100% màn hình điện thoại */
                max-height: 100vh;
                border-radius: 0; 
                border: none;
            }
            
            /* Tái cấu trúc lại lưới thành dạng Thẻ (Card) giống App Sofascore */
            .match-row { 
                grid-template-columns: 1fr 60px 1fr; /* Cột: Đội nhà - Tỷ số - Đội khách */
                grid-template-rows: auto auto auto; 
                row-gap: 8px; 
                padding: 12px 10px; 
            }
            
            /* Đưa giờ thi đấu lên trên cùng, vắt ngang qua 3 cột */
            .time { 
                grid-column: 1 / span 3; 
                text-align: center; 
                padding-bottom: 5px; 
                border-bottom: 1px dashed var(--border-color); 
                font-size: 13px;
            }
            
            .team.home { text-align: right; padding-right: 10px; }
            .team.away { text-align: left; padding-left: 10px; }
            
            .score { 
                width: 100%; 
                margin: 0; 
                padding: 4px 0;
            }
            
            /* Đưa trạng thái xuống dưới cùng */
            .match-status { 
                grid-column: 1 / span 3; 
                text-align: center; 
                padding-top: 5px;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <header>
            <h1>Lịch Thi Đấu ⚽</h1>
            <div class="status-text" id="updateTime">Đang tải dữ liệu...</div>
        </header>

        <div class="match-list-wrapper">
            <div class="match-list" id="matchesList">
                </div>
        </div>
    </div>

    <script>
        const dataUrl = 'data.json?t=' + new Date().getTime();

        fetch(dataUrl)
            .then(response => response.json())
            .then(data => {
                document.getElementById('updateTime').innerHTML = `&#10227; Cập nhật lần cuối: ${data.last_updated}`;
                
                const container = document.getElementById('matchesList');
                container.innerHTML = ''; 
                
                if(data.leagues && data.leagues.length > 0) {
                    data.leagues.forEach(league => {
                        container.innerHTML += `<div class="league-header">${league.name}</div>`;
                        
                        league.matches.forEach(match => {
                            container.innerHTML += `
                                <div class="match-row">
                                    <div class="time">${match.time}</div>
                                    <div class="team home">${match.home}</div>
                                    <div class="score">${match.score}</div>
                                    <div class="team away">${match.away}</div>
                                    <div class="match-status">${match.status}</div>
                                </div>
                            `;
                        });
                    });
                } else {
                    container.innerHTML = '<div style="padding: 40px; text-align: center; color: #718096; font-size: 15px;">⚽ Hôm nay không còn trận đấu nào sắp diễn ra.</div>';
                }
            })
            .catch(error => {
                document.getElementById('updateTime').innerHTML = 'Lỗi tải dữ liệu. Hãy đảm bảo bot đã chạy!';
                console.error("Fetch Error:", error);
            });
    </script>
</body>
</html>
