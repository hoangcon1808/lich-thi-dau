<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lịch Thi Đấu Bóng Đá</title>
    <style>
        :root {
            --bg-color: #f3f6f4;
            --container-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --primary-green: #10b981;
            --dark-green: #059669;
            --light-green: #d1fae5;
            --league-bg: #f8fafc;
            --live-red: #ef4444; 
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2vh 15px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .dashboard {
            width: 100%;
            max-width: 800px;
            background: var(--container-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--border-color);
            max-height: 96vh; 
            display: flex;
            flex-direction: column; 
        }

        header {
            background: linear-gradient(135deg, var(--dark-green) 0%, var(--primary-green) 100%);
            padding: 20px;
            text-align: center;
            color: white;
            position: relative;
            z-index: 20;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex-shrink: 0; 
        }

        h1 { margin: 0; font-size: 24px; font-weight: 800; text-transform: uppercase; }
        
        .live-clock {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.15);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .status-text { margin-top: 10px; font-size: 12px; color: rgba(255, 255, 255, 0.85); }

        .match-list-wrapper {
            flex-grow: 1; 
            overflow-y: auto;
            background: var(--container-bg);
            position: relative;
        }

        .match-list-wrapper::-webkit-scrollbar { width: 6px; }
        .match-list-wrapper::-webkit-scrollbar-track { background: #f1f5f9; }
        .match-list-wrapper::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .match-list-wrapper::-webkit-scrollbar-thumb:hover { background: var(--primary-green); }

        /* KHỐI TIÊU ĐỀ LỚN (ĐANG DIỄN RA / SẮP DIỄN RA) */
        .master-section {
            padding: 12px 15px;
            font-size: 15px;
            font-weight: 800;
            text-align: center;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border-color);
        }
        .section-live { background: #fee2e2; color: #b91c1c; }
        .section-upcoming { background: #f1f5f9; color: #334155; }

        .league-header {
            background-color: var(--league-bg);
            color: var(--dark-green);
            padding: 8px 15px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
        }
        .league-header::before { content: "🏆"; margin-right: 8px; font-size: 15px; }

        .match-row {
            display: grid;
            grid-template-columns: 80px 1fr 70px 1fr 100px;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }
        .match-row:hover { background-color: var(--light-green); }
        .match-row:last-child { border-bottom: none; }

        .time { color: var(--text-muted); font-size: 14px; font-weight: 600; }
        .team { font-size: 15px; font-weight: 700; color: var(--text-main); }
        .team.home { text-align: right; padding-right: 15px; }
        .team.away { text-align: left; padding-left: 15px; }
        
        .score {
            text-align: center; font-size: 13px; font-weight: bold; color: white;
            background: var(--primary-green); padding: 5px 0; border-radius: 20px;
        }
        .match-status { text-align: right; font-size: 12px; color: var(--primary-green); font-weight: 600; }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .score.is-live {
            background: var(--live-red);
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
            font-size: 15px;
        }
        .match-status.is-live {
            color: var(--live-red);
            animation: blink 1.5s infinite;
        }

        @media (max-width: 600px) {
            body { padding: 0; align-items: stretch; }
            .dashboard { max-width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; border: none; }
            .match-row { grid-template-columns: 1fr 70px 1fr; grid-template-rows: auto auto auto; row-gap: 8px; padding: 12px 10px; }
            .time { grid-column: 1 / span 3; text-align: center; padding-bottom: 5px; border-bottom: 1px dashed var(--border-color); font-size: 13px; }
            .team.home { text-align: right; padding-right: 10px; }
            .team.away { text-align: left; padding-left: 10px; }
            .score { width: 100%; margin: 0; padding: 4px 0; }
            .match-status { grid-column: 1 / span 3; text-align: center; padding-top: 5px; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <header>
            <h1>Lịch Thi Đấu ⚽</h1>
            <div class="live-clock" id="realTimeClock">Đang tải ngày giờ...</div>
            <div class="status-text" id="updateTime">Bot đang tải dữ liệu...</div>
        </header>

        <div class="match-list-wrapper" id="matchesList">
            </div>
    </div>

    <script>
        function startRealTimeClock() {
            function updateClock() {
                const now = new Date();
                const days = ['Chủ Nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
                const dayName = days[now.getDay()];
                const d = String(now.getDate()).padStart(2, '0');
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const y = now.getFullYear();
                const hr = String(now.getHours()).padStart(2, '0');
                const min = String(now.getMinutes()).padStart(2, '0');
                const sec = String(now.getSeconds()).padStart(2, '0');
                
                document.getElementById('realTimeClock').innerHTML = `🕒 Hôm nay: ${dayName}, ${d}/${m}/${y} | ${hr}:${min}:${sec}`;
            }
            setInterval(updateClock, 1000);
            updateClock();
        }
        startRealTimeClock();

        const dataUrl = 'data.json?t=' + new Date().getTime();

        fetch(dataUrl)
            .then(response => response.json())
            .then(data => {
                document.getElementById('updateTime').innerHTML = `&#10227; Bot cập nhật cuối lúc: ${data.last_updated}`;
                
                const container = document.getElementById('matchesList');
                container.innerHTML = ''; 
                
                let hasAnyMatch = false;

                // 1. RENDER KHU VỰC ĐANG DIỄN RA
                if(data.live_leagues && data.live_leagues.length > 0) {
                    hasAnyMatch = true;
                    container.innerHTML += `<div class="master-section section-live">🔴 ĐANG DIỄN RA</div>`;
                    
                    data.live_leagues.forEach(league => {
                        container.innerHTML += `<div class="league-header">${league.name}</div>`;
                        league.matches.forEach(match => {
                            container.innerHTML += `
                                <div class="match-row">
                                    <div class="time">${match.time}</div>
                                    <div class="team home">${match.home}</div>
                                    <div class="score is-live">${match.score}</div>
                                    <div class="team away">${match.away}</div>
                                    <div class="match-status is-live">${match.status}</div>
                                </div>
                            `;
                        });
                    });
                }

                // 2. RENDER KHU VỰC SẮP DIỄN RA
                if(data.upcoming_leagues && data.upcoming_leagues.length > 0) {
                    hasAnyMatch = true;
                    container.innerHTML += `<div class="master-section section-upcoming">🗓 SẮP DIỄN RA</div>`;
                    
                    data.upcoming_leagues.forEach(league => {
                        container.innerHTML += `<div class="league-header">${league.name}</div>`;
                        league.matches.forEach(match => {
                            container.innerHTML += `
                                <div class="match-row">
                                    <div class="time">${match.time}</div>
                                    <div class="team home">${match.home}</div>
                                    <div class="score">${match.score}</div>
                                    <div class="team away">${match.away}</div>
                                    <div class="match-status">${match.status}</div>
                                </div>
                            `;
                        });
                    });
                }

                if(!hasAnyMatch) {
                    container.innerHTML = '<div style="padding: 40px; text-align: center; color: #718096; font-size: 15px;">⚽ Hôm nay chưa có trận đấu nào.</div>';
                }
            })
            .catch(error => {
                document.getElementById('updateTime').innerHTML = 'Lỗi tải dữ liệu. Hãy đảm bảo bot đã chạy!';
                console.error("Fetch Error:", error);
            });
    </script>
</body>
</html>
